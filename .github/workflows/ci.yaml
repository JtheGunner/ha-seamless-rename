name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.14
      - run: uv run ruff check .
      - run: uv run mypy custom_components
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Panel component tests
        run: node --test tests/panel

  # Runs the HA tests against the newest Home Assistant pre-release to catch changes in
  # internal APIs early. Advisory: a failure here does not block a merge.
  beta:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.14
      - name: Upgrade to the Home Assistant pre-release
        run: uv pip install --prerelease=allow --upgrade pytest-homeassistant-custom-component
      - run: uv run --no-sync pytest
