[project]
name = "ha-seamless-rename"
version = "0.1.0"
description = "Home Assistant integration that renames entity IDs and updates all consumers safely."
requires-python = ">=3.14"
dependencies = ["PyYAML"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "types-PyYAML",
  "pytest-homeassistant-custom-component>=0.13.316",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "custom_components.entity_rename_safe.engine.*"
strict = true
